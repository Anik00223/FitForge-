services:
  redis-showcase:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web-showcase:
    build: .
    restart: unless-stopped
    ports:
      - "8011:8000"
    env_file:
      - .env.showcase
    depends_on:
      redis-showcase:
        condition: service_healthy
    volumes:
      - showcase_static_volume:/app/staticfiles
      - showcase_media_volume:/app/media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5

  nginx-showcase:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx.showcase.conf:/etc/nginx/conf.d/default.conf
      - showcase_static_volume:/app/staticfiles
      - showcase_media_volume:/app/media
    depends_on:
      web-showcase:
        condition: service_started

volumes:
  showcase_static_volume:
  showcase_media_volume:
