apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fitforge

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml
  - migrate-job.yaml
  - backup-cronjob.yaml

commonLabels:
  app.kubernetes.io/name: fitforge
  app.kubernetes.io/managed-by: kustomize
