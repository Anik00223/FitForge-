apiVersion: v1
kind: Service
metadata:
  name: fitforge-web
  labels:
    app.kubernetes.io/name: fitforge
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: fitforge
    app.kubernetes.io/component: web
---
apiVersion: v1
kind: Service
metadata:
  name: fitforge-worker
  labels:
    app.kubernetes.io/name: fitforge
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  # Headless service to give worker pods stable DNS names.  Useful for
  # ad-hoc ``kubectl exec`` debugging and for any future per-worker
  # routing logic.
  clusterIP: None
  selector:
    app.kubernetes.io/name: fitforge
    app.kubernetes.io/component: worker
