apiVersion: v1
kind: Secret
metadata:
  name: fitforge-secrets
  labels:
    app.kubernetes.io/name: fitforge
    app.kubernetes.io/component: secrets
type: Opaque
# All values must be supplied at install time via Kustomize patches,
# External Secrets, or sealed-secrets.  This file only documents the
# keys the application expects.
stringData:
  # Django
  SECRET_KEY: "CHANGE_ME"
  # External services
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/fitforge"
  REDIS_URL: "redis://:PASSWORD@HOST:6379/0"
  # NVIDIA
  NVIDIA_API_KEY: "CHANGE_ME"
  # Sentry
  SENTRY_DSN: ""
  SENTRY_RELEASE: ""
  # Supabase
  SUPABASE_URL: ""
  SUPABASE_PUBLISHABLE_KEY: ""
  SUPABASE_SERVICE_ROLE_KEY: ""
  # OAuth (use sealed-secrets in production)
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  MICROSOFT_CLIENT_ID: ""
  MICROSOFT_CLIENT_SECRET: ""
  MICROSOFT_TENANT_ID: "common"
  APPLE_SERVICE_ID: ""
  APPLE_KEY_ID: ""
  APPLE_TEAM_ID: ""
  APPLE_PRIVATE_KEY: ""
  # Email
  EMAIL_HOST: ""
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
