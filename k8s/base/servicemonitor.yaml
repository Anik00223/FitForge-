apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fitforge-web
  labels:
    app.kubernetes.io/name: fitforge
    app.kubernetes.io/component: web
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fitforge
      app.kubernetes.io/component: web
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
